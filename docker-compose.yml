services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SCAMSHIELD_CORS_ALLOWED_ORIGINS: http://localhost:3000

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "3000:80"
    depends_on:
      - backend