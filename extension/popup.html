<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ScamShield</title>
  <style>
    body { width: 340px; margin: 0; padding: 16px; background: #0f172a; color: #fff;
           font-family: system-ui, sans-serif; font-size: 14px; }
    h1 { margin: 0 0 4px; font-size: 18px; color: #34d399; }
    p.sub { margin: 0 0 12px; color: #94a3b8; font-size: 12px; }
    textarea { width: 100%; box-sizing: border-box; height: 90px; padding: 8px; resize: vertical;
               background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 8px; }
    button { width: 100%; margin-top: 8px; padding: 10px; border: 0; border-radius: 8px;
             background: #10b981; color: #0f172a; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #error { margin-top: 8px; color: #f87171; }
    #result { display: none; margin-top: 12px; padding: 12px; background: #1e293b;
              border: 1px solid #334155; border-radius: 8px; }
    .row { display: flex; justify-content: space-between; align-items: center; }
    #badge { padding: 2px 10px; border-radius: 999px; font-weight: 600; color: #0f172a; }
    #score { font-size: 22px; font-weight: 700; }
    ul { margin: 10px 0 0; padding-left: 18px; }
    li { margin-bottom: 4px; }
  </style>
</head>
<body>
  <h1>ScamShield</h1>
  <p class="sub">Select text on a page before opening, or paste it here.</p>
  <textarea id="message" dir="auto" placeholder="Paste a suspicious message..."></textarea>
  <button id="scan">Scan message</button>
  <p id="error"></p>
  <div id="result">
    <div class="row"><span id="badge"></span><span id="score"></span></div>
    <ul id="reasons"></ul>
  </div>
  <script src="popup.js"></script>
</body>
</html>
