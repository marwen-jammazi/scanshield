spring.application.name=backend

# Local development database (H2, stored in backend/data/)
spring.datasource.url=jdbc:h2:file:./data/scamshield
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT signing key: override with the JWT_SECRET environment variable in production
scamshield.jwt.secret=${JWT_SECRET:dev-only-secret-change-before-deploying-0123456789}